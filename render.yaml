services:
  - type: web
    name: lingualeap
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run db:generate -w server && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    disk:
      name: lingualeap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/var/data/lingualeap.db
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
